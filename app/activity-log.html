<title>활동지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
/* Layout: sketchbook page. Crayon-outlined wobbly cards on cream paper, one column, two columns for results. */
:root{
  --bg:#fbf4e2; --paper:#fffaf0; --fg:#4a3b32; --muted:#8b7a6c; --line:#d9c9ac;
  --red:#e4574b; --orange:#f29a38; --yellow:#f7d047; --green:#6bb85a; --blue:#4f9bd9; --purple:#9a79c9;
  --accent:#e4574b; --accent-fg:#fffaf0; --accent-soft:#fde0b8; --done-soft:#d9efc9; --blue-soft:#d4e8f8;
  --warn:#8a5a14; --warn-soft:#fbe9b0; --skip:#a39484;
  --font-display:'Gamja Flower','Gaegu','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Gaegu','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --wobble:255px 18px 225px 18px/18px 225px 18px 255px;
  --wobble2:18px 225px 18px 255px/255px 18px 225px 18px;
  --grain:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1.2px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b2622; --paper:#352f2a; --fg:#f3e8d6; --muted:#b5a592; --line:#554b42;
  --red:#ff7b6e; --orange:#ffb25c; --yellow:#ffdf6b; --green:#8fd37c; --blue:#7ab8ee; --purple:#b99be6;
  --accent:#ff7b6e; --accent-fg:#2b2622; --accent-soft:#5a4430; --done-soft:#3a4a33; --blue-soft:#2f4358;
  --warn:#f3cf7b; --warn-soft:#4d4025; --skip:#8d7f70;
  --grain:radial-gradient(rgba(255,230,190,.05) 1px,transparent 1.2px); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#2b2622; --paper:#352f2a; --fg:#f3e8d6; --muted:#b5a592; --line:#554b42;
  --red:#ff7b6e; --orange:#ffb25c; --yellow:#ffdf6b; --green:#8fd37c; --blue:#7ab8ee; --purple:#b99be6;
  --accent:#ff7b6e; --accent-fg:#2b2622; --accent-soft:#5a4430; --done-soft:#3a4a33; --blue-soft:#2f4358;
  --warn:#f3cf7b; --warn-soft:#4d4025; --skip:#8d7f70;
  --grain:radial-gradient(rgba(255,230,190,.05) 1px,transparent 1.2px); color-scheme:dark;}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--grain);background-size:6px 6px;color:var(--fg);font-family:var(--font-body);font-size:18px;line-height:1.6;margin:0;padding-inline:16px;padding-block:22px 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:38px;margin:0;font-weight:400;line-height:1.1;letter-spacing:1px;
  background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 90%,transparent 90%);padding:0 8px;transform:rotate(-1.5deg);display:inline-block}
.date{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;padding:3px 14px;border:2.5px solid var(--line);border-radius:var(--wobble);background:var(--paper);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:nth-child(3n+2){border-radius:var(--wobble2)}
.chip:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.chip[aria-current="true"]{border-color:var(--blue);background:var(--blue-soft);transform:rotate(-2deg)}
.chip.filled{background:var(--done-soft);border-color:var(--green)}
.chip.skipped{color:var(--skip);text-decoration:line-through;border-style:dashed}
.chip small{color:var(--muted);font-size:13px}
.card{background:var(--paper);border:3px solid var(--orange);border-radius:var(--wobble);padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:5px 6px 0 rgba(139,122,108,.25)}
.card+.card{border-color:var(--blue);border-radius:var(--wobble2)}
.q{font-family:var(--font-display);font-size:28px;margin:0;line-height:1.35}
.meta{color:var(--muted);font-size:16px;margin:0}
textarea{width:100%;min-height:104px;resize:vertical;font:inherit;color:var(--fg);background:var(--bg);border:2.5px dashed var(--muted);border-radius:14px 22px 16px 24px/22px 14px 24px 16px;padding:12px 14px}
textarea::placeholder{color:var(--skip)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.btn{font:inherit;font-size:19px;padding:5px 20px;border-radius:var(--wobble);border:3px solid var(--fg);background:var(--paper);color:var(--fg);cursor:pointer;box-shadow:3px 4px 0 rgba(74,59,50,.35);transition:transform .1s}
button.btn:hover:not(:disabled){transform:translate(-1px,-1px) rotate(-1deg)}
button.btn:active:not(:disabled){transform:translate(2px,3px);box-shadow:none}
button.primary{background:var(--yellow);color:#4a3b32;border-color:#4a3b32}
button.ghost{border-color:transparent;box-shadow:none;color:var(--muted);text-decoration:underline wavy var(--line)}
button:disabled{opacity:.45;cursor:default}
.note{background:var(--warn-soft);color:var(--warn);border-radius:14px 22px 16px 24px/22px 14px 24px 16px;padding:10px 14px;font-size:16px}
.summary{gap:14px}
.entry{border:2.5px solid var(--green);border-radius:var(--wobble2);padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.grid .entry:nth-child(4n+2){border-color:var(--blue)}
.grid .entry:nth-child(4n+3){border-color:var(--purple);border-radius:var(--wobble)}
.grid .entry:nth-child(4n+4){border-color:var(--orange)}
.entry-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry h3{margin:0;font-family:var(--font-display);font-size:23px;font-weight:400}
.entry p{margin:0;white-space:pre-wrap;font-size:17px;line-height:1.6}
button.small{font-size:16px;padding:1px 14px;border-width:2.5px;box-shadow:2px 3px 0 rgba(74,59,50,.3)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.wrap.wide{max-width:920px}
.skipline{color:var(--skip);font-size:16px;margin:0}
.hint{color:var(--muted);font-size:15px;margin:0}
@media (prefers-reduced-motion:reduce){button.btn{transition:none}}

.listbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{font:inherit;font-size:18px;color:var(--fg);background:var(--bg);border:2.5px dashed var(--muted);border-radius:14px 22px 16px 24px/22px 14px 24px 16px;padding:4px 12px;min-width:0;width:100%}
.krow{display:grid;grid-template-columns:minmax(0,1fr) 62px 64px auto;gap:8px;align-items:center}
.klabel{display:grid;grid-template-columns:minmax(0,1fr) 62px 64px auto;gap:8px;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field span{color:var(--muted);font-size:15px}
button.danger{color:var(--red);border-color:var(--red);box-shadow:2px 3px 0 rgba(228,87,75,.3)}
</style>

<div class="wrap" id="app"></div>

<script>
const SEED=[
  {n:"앤디",age:5,sex:"남"},{n:"비니",age:6,sex:"여"},{n:"쿠시",age:5,sex:"여"},
  {n:"데니",age:4,sex:"남"},{n:"에반",age:6,sex:"남"},{n:"퍼지",age:7,sex:"여"},
  {n:"고유",age:5,sex:"남"},{n:"헨디",age:6,sex:"여"},{n:"이루",age:7,sex:"남"}
];
const TONE=`너는 어린이집 담임 교사다. 아래 키워드나 문장을 바탕으로 보호자에게 전하는 하루 활동일지를 쓴다.
- 7줄 정도로 쓴다. 한 줄에 한 문장씩, 줄바꿈으로 구분한다.
- 따뜻하고 평범한 교사 말투로 쓴다. '~했습니다', '~하는 모습이었습니다', '~해 보았습니다'를 쓴다.
- 이모티콘은 쓰지 않는다. 과장하거나 문학적인 표현은 쓰지 않는다.
- 교사가 준 내용에 없는 사실, 대사, 시간, 횟수, 감정은 지어내지 않는다. 입력이 적으면 줄 수를 줄여도 된다.
- 아이를 평가하거나 단정하지 않고 관찰한 모습 중심으로 쓴다. 부정적인 행동은 비난 없이 부드럽게 쓴다.
- 식사, 낮잠, 건강 내용은 교사가 말한 것만 쓴다.
- 제목, 설명, 머리말 없이 일지 본문만 출력한다. 첫 줄은 '오늘' 활동으로 시작한다.`;
const today=new Date().toISOString().slice(0,10);
const RKEY="activity-roster-v1",DKEY="activity-day-v3-"+today,OLDKEY="activity-log-v2-"+today;
const uid=()=>"k"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const put=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
// R: 명단(오래 보관). D: 오늘 작성 상태(날짜별, 목록별, 아이 id별)
let R=load(RKEY);
if(!R||!Array.isArray(R.lists)||!R.lists.length){R={lists:[{id:uid(),name:"1번 목록",kids:SEED.map(k=>({id:uid(),...k}))}],cur:null}}
if(!R.cur||!R.lists.some(l=>l.id===R.cur))R.cur=R.lists[0].id;
let D=load(DKEY);
if(!D||!D.byList){
  D={byList:{}};
  const old=load(OLDKEY); // 이전 버전에서 오늘 입력한 내용을 첫 목록으로 옮긴다
  if(old&&old.items&&old.items.length===R.lists[0].kids.length){
    const l=R.lists[0];
    D.byList[l.id]={i:old.i||0,finished:!!old.finished,items:Object.fromEntries(l.kids.map((k,j)=>[k.id,{kw:old.items[j].kw||"",skipped:!!old.items[j].skipped,text:old.items[j].text||"",gen:old.items[j].gen||""}]))};
  }
}
let sample=null,busy=false,err="",progress="",mgr=false,conf="",focusLast=false;
const $=document.getElementById("app");
const saveR=()=>put(RKEY,R),saveD=()=>put(DKEY,D),save=()=>{saveR();saveD()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=()=>R.lists.find(l=>l.id===R.cur);
const kids=()=>L().kids;
const day=()=>D.byList[R.cur]||(D.byList[R.cur]={i:0,finished:false,items:{}});
const it=k=>day().items[k.id]||(day().items[k.id]={kw:"",skipped:false,text:"",gen:""});
const has=k=>it(k).kw.trim().length>0&&!it(k).skipped;
const count=()=>kids().filter(has).length;
const label=k=>k.n.trim()||"(이름 없음)";
const info=k=>[k.age?k.age+"세":"",k.sex||""].filter(Boolean).join(" ");
const prompt=(k,kw)=>`${TONE}\n\n아이: ${label(k)}${info(k)?` (${info(k).replace(" ",", ")})`:""}\n교사가 적은 오늘 활동: ${kw}\n\n${label(k)}의 오늘 활동일지 본문만 쓴다.`;
function go(j){day().i=j;err="";saveD();render()}
function clampI(){const d=day(),n=kids().length;if(d.i>=n)d.i=Math.max(0,n-1)}

function listbar(){
  return `<div class="listbar" role="group" aria-label="명단 목록">`+R.lists.map(l=>`<button class="chip" data-list="${l.id}" aria-current="${l.id===R.cur}">${esc(l.name||"이름 없는 목록")}</button>`).join("")+
   `<button class="btn small ghost" id="mgr">${mgr?"명단 닫기":"명단 관리"}</button></div>`;
}
function render(){
  const date=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
  const head=`<header><h1>활동지</h1><span class="date">${date}</span></header>`;
  clampI();
  const d=day();
  $.classList.toggle("wide",d.finished&&!mgr);
  if(mgr){$.innerHTML=head+listbar()+manager();bind();if(focusLast){focusLast=false;const a=document.querySelectorAll("[data-kn]");if(a.length)a[a.length-1].focus()}return}
  if(!kids().length){$.innerHTML=head+listbar()+`<div class="card"><p class="q">이 목록에는 아직 아이가 없어요</p><p class="hint">명단 관리에서 아이를 추가해 주세요.</p><div class="row"><button class="btn primary" id="mgr2">아이 추가하기</button></div></div>`;bind();return}
  if(d.finished){$.innerHTML=head+listbar()+summary();bind();return}
  const strip=`<nav class="strip" aria-label="아이 목록">`+kids().map((k,j)=>{
    const cls=it(k).skipped?"skipped":has(k)?"filled":"";
    const tag=it(k).skipped?"건너뜀":has(k)?"입력됨":"";
    return `<button class="chip ${cls}" data-go="${j}" aria-current="${j===d.i}">${esc(label(k))}${tag?`<small>${tag}</small>`:""}</button>`}).join("")+`</nav>`;
  const k=kids()[d.i],cur=it(k),last=d.i===kids().length-1;
  const body=`<div class="card"><p class="meta">${d.i+1}/${kids().length}${info(k)?" · "+info(k):""}</p>
    <p class="q">오늘 '${esc(label(k))}'의 하루는 어땠나요?</p>
    <textarea id="kw" aria-label="활동 키워드" ${busy?"disabled":""}>${esc(cur.kw)}</textarea>
    <p class="hint">여기서는 일지를 만들지 않고 입력만 저장합니다. 모두 적은 뒤 아래 버튼으로 한 번에 작성합니다.</p>
    <div class="row"><button class="btn primary" id="next" ${busy?"disabled":""}>${last?"저장":"다음 아이"}</button>
    <button class="btn ghost" id="skip" ${busy?"disabled":""}>${cur.skipped?"건너뛰기 취소":"건너뛰기"}</button></div></div>`;
  const n=count();
  const fin=`<div class="card">${sample?"":`<div class="note">자동 작성을 쓸 수 없는 화면입니다. 키워드를 정리해 대화창에 붙여 넣을 수 있게 만듭니다.</div>`}
    ${err?`<div class="note">${esc(err)}</div>`:""}
    <div class="row"><button class="btn primary" id="batchmake" ${busy||!n?"disabled":""}>${busy?progress:(sample?`${n}명 한 번에 작성`:`${n}명 정리하기`)}</button></div>
    <p class="hint">적지 않은 아이는 자동으로 건너뜁니다.</p></div>`;
  $.innerHTML=head+listbar()+strip+body+fin;bind();
}
function manager(){
  const l=L();
  const rows=l.kids.map((k,j)=>`<div class="krow"><input class="inp" data-kn="${j}" value="${esc(k.n)}" placeholder="이름" aria-label="이름">
    <input class="inp" data-ka="${j}" type="number" min="0" max="12" value="${esc(k.age??"")}" aria-label="나이">
    <select class="inp" data-ks="${j}" aria-label="성별"><option value="남" ${k.sex==="남"?"selected":""}>남</option><option value="여" ${k.sex==="여"?"selected":""}>여</option></select>
    <button class="btn small ${conf===k.id?"danger":""}" data-kdel="${j}">${conf===k.id?"정말 삭제":"삭제"}</button></div>`).join("");
  return `<div class="card"><p class="q">명단 관리</p>
    <div class="field"><span>목록 이름</span><input class="inp" id="lname" value="${esc(l.name)}" aria-label="목록 이름"></div>
    <div class="klabel"><span>이름</span><span>나이</span><span>성별</span><span></span></div>
    ${rows||`<p class="hint">아이를 추가해 주세요.</p>`}
    <div class="row"><button class="btn" id="addkid">+ 아이 추가</button></div></div>
    <div class="card"><div class="row"><button class="btn primary" id="mgrdone">완료</button>
    <button class="btn" id="newlist">+ 새 목록</button>
    ${R.lists.length>1?`<button class="btn ${conf==="L"+l.id?"danger":""}" id="dellist">${conf==="L"+l.id?"정말 이 목록 삭제":"이 목록 삭제"}</button>`:""}</div>
    <p class="hint">새 목록은 빈 명단으로 시작합니다. 목록마다 오늘 작성 내용이 따로 저장됩니다.</p></div>`;
}
function summary(){
  const done=kids().map(k=>has(k)?`<div class="entry"><div class="entry-head"><h3>${esc(label(k))}</h3><button class="btn small" data-copy="${esc(k.id)}">복사</button></div><p>${esc(it(k).text||("키워드: "+it(k).kw.trim()))}</p></div>`:"").join("");
  const skipped=kids().filter(k=>!has(k)).map(k=>label(k));
  return `<div class="card summary"><p class="q">오늘 활동지 정리</p>
    <p class="hint">아이별 복사 버튼으로 한 명씩 복사할 수 있습니다.</p>
    <div class="grid">${done}</div>
    ${skipped.length?`<p class="skipline">건너뜀: ${skipped.map(esc).join(", ")}</p>`:""}
    <div class="row"><button class="btn" id="copyall">전체 복사</button><button class="btn" id="back">돌아가서 수정</button></div>
    ${sample?"":`<p class="hint">자동 작성이 꺼져 있어 키워드만 정리했습니다. 이 내용을 대화창에 붙여 넣고 아이별 일지로 써 달라고 요청하세요.</p>`}</div>`;
}
async function copy(text,btn){
  const small=btn.classList.contains("small"),orig=btn.textContent;
  try{await navigator.clipboard.writeText(text);btn.textContent="복사됨"}catch(e){btn.textContent="복사 실패"}
  if(small)setTimeout(()=>{btn.textContent=orig},1500);
}
function allText(){
  return kids().filter(has).map(k=>`[${label(k)}]\n${it(k).text||("키워드: "+it(k).kw.trim())}`).join("\n\n")
}
function dropKid(id){Object.values(D.byList).forEach(d=>{delete d.items[id]})}
function leaveMgr(){
  // 이름을 비워 둔 아이는 명단에서 뺀다
  R.lists.forEach(l=>{l.kids=l.kids.filter(k=>{if(k.n.trim())return true;dropKid(k.id);return false})});
  conf="";mgr=false;save();render();
}
function bind(){
  const g=id=>document.getElementById(id);
  const lock=f=>(...a)=>{if(!busy)f(...a)};
  document.querySelectorAll("[data-list]").forEach(b=>b.onclick=lock(()=>{if(mgr){R.lists.forEach(l=>{l.kids=l.kids.filter(k=>k.n.trim()||(dropKid(k.id),false))})}R.cur=b.dataset.list;conf="";err="";save();render()}));
  if(g("mgr"))g("mgr").onclick=lock(()=>{if(mgr)leaveMgr();else{mgr=true;conf="";render()}});
  if(g("mgr2"))g("mgr2").onclick=()=>{mgr=true;render()};
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=lock(()=>go(+b.dataset.go)));
  const d=day();
  if(g("kw"))g("kw").oninput=e=>{const x=it(kids()[d.i]);x.kw=e.target.value;if(x.kw.trim())x.skipped=false;saveD();updateBtn()};
  if(g("next"))g("next").onclick=()=>{if(d.i<kids().length-1)go(d.i+1);else{saveD();render()}};
  if(g("skip"))g("skip").onclick=()=>{const x=it(kids()[d.i]);x.skipped=!x.skipped;saveD();if(x.skipped&&d.i<kids().length-1)go(d.i+1);else render()};
  if(g("batchmake"))g("batchmake").onclick=batchMake;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const k=kids().find(k=>k.id===b.dataset.copy);copy(it(k).text||it(k).kw.trim(),b)});
  if(g("copyall"))g("copyall").onclick=e=>copy(allText(),e.target);
  if(g("back"))g("back").onclick=()=>{d.finished=false;saveD();render()};
  // 명단 관리
  if(g("lname"))g("lname").oninput=e=>{L().name=e.target.value;saveR();const c=document.querySelector(`[data-list="${R.cur}"]`);if(c)c.textContent=e.target.value||"이름 없는 목록"};
  document.querySelectorAll("[data-kn]").forEach(a=>a.oninput=e=>{kids()[+a.dataset.kn].n=e.target.value;saveR()});
  document.querySelectorAll("[data-ka]").forEach(a=>a.oninput=e=>{kids()[+a.dataset.ka].age=e.target.value===""?"":+e.target.value;saveR()});
  document.querySelectorAll("[data-ks]").forEach(a=>a.onchange=e=>{kids()[+a.dataset.ks].sex=e.target.value;saveR()});
  document.querySelectorAll("[data-kdel]").forEach(b=>b.onclick=()=>{
    const k=kids()[+b.dataset.kdel];
    if(conf===k.id){L().kids=kids().filter(x=>x.id!==k.id);dropKid(k.id);conf="";save()}else conf=k.id;
    render()});
  if(g("addkid"))g("addkid").onclick=()=>{L().kids.push({id:uid(),n:"",age:5,sex:"남"});conf="";focusLast=true;saveR();render()};
  if(g("newlist"))g("newlist").onclick=()=>{const l={id:uid(),name:"새 목록",kids:[]};R.lists.push(l);R.cur=l.id;conf="";focusLast=false;saveR();render();const n=g("lname");if(n){n.focus();n.select()}};
  if(g("dellist"))g("dellist").onclick=()=>{
    const l=L();
    if(conf==="L"+l.id){R.lists=R.lists.filter(x=>x.id!==l.id);delete D.byList[l.id];R.cur=R.lists[0].id;conf="";save()}else conf="L"+l.id;
    render()};
  if(g("mgrdone"))g("mgrdone").onclick=leaveMgr;
}
function updateBtn(){
  const b=document.getElementById("batchmake");if(!b)return;
  const n=count();b.disabled=!n;b.textContent=sample?`${n}명 한 번에 작성`:`${n}명 정리하기`;
  const d=day(),k=kids()[d.i],c=document.querySelector(`[data-go="${d.i}"]`);
  if(c){const x=it(k);c.className="chip "+(x.skipped?"skipped":x.kw.trim()?"filled":"");c.innerHTML=esc(label(k))+(x.kw.trim()?"<small>입력됨</small>":"")}
}
async function batchMake(){
  const list=kids().filter(has);
  if(!list.length)return;
  const d=day();
  if(!sample){d.finished=true;saveD();render();return}
  // 키워드가 바뀐 아이만 다시 작성한다
  const todo=list.filter(k=>!it(k).text||it(k).gen!==it(k).kw.trim());
  busy=true;err="";let done=0;progress=`작성 중 0/${todo.length}`;render();
  const failed=[],queue=todo.slice();
  async function worker(){
    while(queue.length){
      const k=queue.shift(),x=it(k);
      try{const r=await sample(prompt(k,x.kw.trim()),{cache:false});x.text=r.text.trim();x.gen=x.kw.trim()}
      catch(e){failed.push(label(k));x.text=""}
      done++;progress=`작성 중 ${done}/${todo.length}`;const b=document.getElementById("batchmake");if(b)b.textContent=progress;
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  busy=false;
  if(failed.length)err=`${failed.join(", ")}은(는) 작성에 실패했습니다. 버튼을 다시 눌러 주세요.`;
  else d.finished=true;
  save();render();
}
save();render();
(async()=>{try{const s=await window.claude?.use("sample");if(s){sample=s;if(!busy)render()}}catch(e){}})();
</script>
