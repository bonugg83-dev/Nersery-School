<title>활동지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
/* Layout: sketchbook page. Crayon-outlined wobbly cards on cream paper, one column, two columns for results. */
:root{
  --bg:#fbf4e2; --paper:#fffaf0; --fg:#4a3b32; --muted:#8b7a6c; --line:#d9c9ac;
  --red:#e4574b; --orange:#f29a38; --yellow:#f7d047; --green:#6bb85a; --blue:#4f9bd9; --purple:#9a79c9;
  --accent:#e4574b; --accent-fg:#fffaf0; --accent-soft:#fde0b8; --done-soft:#d9efc9; --blue-soft:#d4e8f8;
  --warn:#8a5a14; --warn-soft:#fbe9b0; --skip:#a39484;
  --font-display:'Gamja Flower','Gaegu','Noto Sans KR',system-ui,sans-serif;
  --font-body:'Gaegu','Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --wobble:255px 18px 225px 18px/18px 225px 18px 255px;
  --wobble2:18px 225px 18px 255px/255px 18px 225px 18px;
  --grain:radial-gradient(rgba(120,90,50,.07) 1px,transparent 1.2px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2b2622; --paper:#352f2a; --fg:#f3e8d6; --muted:#b5a592; --line:#554b42;
  --red:#ff7b6e; --orange:#ffb25c; --yellow:#ffdf6b; --green:#8fd37c; --blue:#7ab8ee; --purple:#b99be6;
  --accent:#ff7b6e; --accent-fg:#2b2622; --accent-soft:#5a4430; --done-soft:#3a4a33; --blue-soft:#2f4358;
  --warn:#f3cf7b; --warn-soft:#4d4025; --skip:#8d7f70;
  --grain:radial-gradient(rgba(255,230,190,.05) 1px,transparent 1.2px); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#2b2622; --paper:#352f2a; --fg:#f3e8d6; --muted:#b5a592; --line:#554b42;
  --red:#ff7b6e; --orange:#ffb25c; --yellow:#ffdf6b; --green:#8fd37c; --blue:#7ab8ee; --purple:#b99be6;
  --accent:#ff7b6e; --accent-fg:#2b2622; --accent-soft:#5a4430; --done-soft:#3a4a33; --blue-soft:#2f4358;
  --warn:#f3cf7b; --warn-soft:#4d4025; --skip:#8d7f70;
  --grain:radial-gradient(rgba(255,230,190,.05) 1px,transparent 1.2px); color-scheme:dark;}
*{box-sizing:border-box}
body{background-color:var(--bg);background-image:var(--grain);background-size:6px 6px;color:var(--fg);font-family:var(--font-body);font-size:18px;line-height:1.6;margin:0;padding-inline:16px;padding-block:22px 56px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;min-width:0}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-size:38px;margin:0;font-weight:400;line-height:1.1;letter-spacing:1px;
  background:linear-gradient(transparent 62%,var(--yellow) 62%,var(--yellow) 90%,transparent 90%);padding:0 8px;transform:rotate(-1.5deg);display:inline-block}
.date{color:var(--muted);font-size:16px;font-variant-numeric:tabular-nums}
.strip{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:16px;padding:3px 14px;border:2.5px solid var(--line);border-radius:var(--wobble);background:var(--paper);color:var(--fg);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip:nth-child(3n+2){border-radius:var(--wobble2)}
.chip:focus-visible,button:focus-visible,textarea:focus-visible{outline:3px dashed var(--purple);outline-offset:3px}
.chip[aria-current="true"]{border-color:var(--blue);background:var(--blue-soft);transform:rotate(-2deg)}
.chip.filled{background:var(--done-soft);border-color:var(--green)}
.chip.skipped{color:var(--skip);text-decoration:line-through;border-style:dashed}
.chip small{color:var(--muted);font-size:13px}
.card{background:var(--paper);border:3px solid var(--orange);border-radius:var(--wobble);padding:22px 22px 20px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:5px 6px 0 rgba(139,122,108,.25)}
.card+.card{border-color:var(--blue);border-radius:var(--wobble2)}
.q{font-family:var(--font-display);font-size:28px;margin:0;line-height:1.35}
.meta{color:var(--muted);font-size:16px;margin:0}
textarea{width:100%;min-height:104px;resize:vertical;font:inherit;color:var(--fg);background:var(--bg);border:2.5px dashed var(--muted);border-radius:14px 22px 16px 24px/22px 14px 24px 16px;padding:12px 14px;background-image:repeating-linear-gradient(transparent,transparent 28px,rgba(79,155,217,.22) 28px,rgba(79,155,217,.22) 29px)}
textarea::placeholder{color:var(--skip)}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.btn{font:inherit;font-size:19px;padding:5px 20px;border-radius:var(--wobble);border:3px solid var(--fg);background:var(--paper);color:var(--fg);cursor:pointer;box-shadow:3px 4px 0 rgba(74,59,50,.35);transition:transform .1s}
button.btn:hover:not(:disabled){transform:translate(-1px,-1px) rotate(-1deg)}
button.btn:active:not(:disabled){transform:translate(2px,3px);box-shadow:none}
button.primary{background:var(--yellow);color:#4a3b32;border-color:#4a3b32}
button.ghost{border-color:transparent;box-shadow:none;color:var(--muted);text-decoration:underline wavy var(--line)}
button:disabled{opacity:.45;cursor:default}
.note{background:var(--warn-soft);color:var(--warn);border-radius:14px 22px 16px 24px/22px 14px 24px 16px;padding:10px 14px;font-size:16px}
.summary{gap:14px}
.entry{border:2.5px solid var(--green);border-radius:var(--wobble2);padding:12px 16px;display:flex;flex-direction:column;gap:8px;background:var(--paper)}
.grid .entry:nth-child(4n+2){border-color:var(--blue)}
.grid .entry:nth-child(4n+3){border-color:var(--purple);border-radius:var(--wobble)}
.grid .entry:nth-child(4n+4){border-color:var(--orange)}
.entry-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry h3{margin:0;font-family:var(--font-display);font-size:23px;font-weight:400}
.entry p{margin:0;white-space:pre-wrap;font-size:17px;line-height:1.6}
button.small{font-size:16px;padding:1px 14px;border-width:2.5px;box-shadow:2px 3px 0 rgba(74,59,50,.3)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid{grid-template-columns:minmax(0,1fr)}}
.wrap.wide{max-width:920px}
.skipline{color:var(--skip);font-size:16px;margin:0}
.hint{color:var(--muted);font-size:15px;margin:0}
@media (prefers-reduced-motion:reduce){button.btn{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
const ROSTER=[
  {n:"앤디",age:5,sex:"남"},{n:"비니",age:6,sex:"여"},{n:"쿠시",age:5,sex:"여"},
  {n:"데니",age:4,sex:"남"},{n:"에반",age:6,sex:"남"},{n:"퍼지",age:7,sex:"여"},
  {n:"고유",age:5,sex:"남"},{n:"헨디",age:6,sex:"여"},{n:"이루",age:7,sex:"남"}
];
const TONE=`너는 어린이집 담임 교사다. 아래 키워드나 문장을 바탕으로 보호자에게 전하는 하루 활동일지를 쓴다.
- 7줄 정도로 쓴다. 한 줄에 한 문장씩, 줄바꿈으로 구분한다.
- 따뜻하고 평범한 교사 말투로 쓴다. '~했습니다', '~하는 모습이었습니다', '~해 보았습니다'를 쓴다.
- 이모티콘은 쓰지 않는다. 과장하거나 문학적인 표현은 쓰지 않는다.
- 교사가 준 내용에 없는 사실, 대사, 시간, 횟수, 감정은 지어내지 않는다. 입력이 적으면 줄 수를 줄여도 된다.
- 아이를 평가하거나 단정하지 않고 관찰한 모습 중심으로 쓴다. 부정적인 행동은 비난 없이 부드럽게 쓴다.
- 식사, 낮잠, 건강 내용은 교사가 말한 것만 쓴다.
- 제목, 설명, 머리말 없이 일지 본문만 출력한다. 첫 줄은 '오늘' 활동으로 시작한다.`;
const KEY="activity-log-v2-"+new Date().toISOString().slice(0,10);
// item: kw = 입력한 키워드, skipped = 건너뜀, text = 작성된 일지, gen = 일지를 만들 때 쓴 키워드
let S={i:0,items:ROSTER.map(()=>({kw:"",skipped:false,text:"",gen:""})),finished:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.items&&s.items.length===ROSTER.length)S=s}catch(e){}
let sample=null,busy=false,err="",progress="";
const $=document.getElementById("app");
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const has=j=>S.items[j].kw.trim().length>0&&!S.items[j].skipped;
const count=()=>ROSTER.filter((c,j)=>has(j)).length;
const prompt=(c,kw)=>`${TONE}\n\n아이: ${c.n} (${c.age}세, ${c.sex})\n교사가 적은 오늘 활동: ${kw}\n\n${c.n}의 오늘 활동일지 본문만 쓴다.`;
function go(j){S.i=j;err="";save();render()}

function render(){
  const date=new Date().toLocaleDateString("ko-KR",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
  const head=`<header><h1>활동지</h1><span class="date">${date}</span></header>`;
  $.classList.toggle("wide",S.finished);
  if(S.finished){$.innerHTML=head+summary();bind();return}
  const strip=`<nav class="strip" aria-label="아이 목록">`+ROSTER.map((c,j)=>{
    const cls=S.items[j].skipped?"skipped":has(j)?"filled":"";
    const tag=S.items[j].skipped?"건너뜀":has(j)?"입력됨":"";
    return `<button class="chip ${cls}" data-go="${j}" aria-current="${j===S.i}">${esc(c.n)}${tag?`<small>${tag}</small>`:""}</button>`}).join("")+`</nav>`;
  const c=ROSTER[S.i],it=S.items[S.i],last=S.i===ROSTER.length-1;
  const body=`<div class="card"><p class="meta">${S.i+1}/${ROSTER.length} · ${c.age}세 ${c.sex}</p>
    <p class="q">오늘 '${esc(c.n)}'의 하루는 어땠나요?</p>
    <textarea id="kw" placeholder="키워드나 짧은 문장으로 적어 주세요. 예: 블록놀이, 친구와 길 만들기, 점심 잘 먹음, 낮잠 1시간" aria-label="활동 키워드" ${busy?"disabled":""}>${esc(it.kw)}</textarea>
    <p class="hint">여기서는 일지를 만들지 않고 입력만 저장합니다. 모두 적은 뒤 아래 버튼으로 한 번에 작성합니다.</p>
    <div class="row"><button class="btn primary" id="next" ${busy?"disabled":""}>${last?"저장":"다음 아이"}</button>
    <button class="btn ghost" id="skip" ${busy?"disabled":""}>${it.skipped?"건너뛰기 취소":"건너뛰기"}</button></div></div>`;
  const n=count();
  const fin=`<div class="card">${sample?"":`<div class="note">자동 작성을 쓸 수 없는 화면입니다. 키워드를 정리해 대화창에 붙여 넣을 수 있게 만듭니다.</div>`}
    ${err?`<div class="note">${esc(err)}</div>`:""}
    <div class="row"><button class="btn primary" id="batchmake" ${busy||!n?"disabled":""}>${busy?progress:(sample?`${n}명 한 번에 작성`:`${n}명 정리하기`)}</button></div>
    <p class="hint">적지 않은 아이는 자동으로 건너뜁니다.</p></div>`;
  $.innerHTML=head+strip+body+fin;bind();
}
function summary(){
  const done=ROSTER.map((c,j)=>has(j)?`<div class="entry"><div class="entry-head"><h3>${esc(c.n)}</h3><button class="btn small" data-copy="${j}">복사</button></div><p>${esc(S.items[j].text||("키워드: "+S.items[j].kw.trim()))}</p></div>`:"").join("");
  const skipped=ROSTER.filter((c,j)=>!has(j)).map(c=>c.n);
  return `<div class="card summary"><p class="q">오늘 활동지 정리</p>
    <p class="hint">아이별 복사 버튼으로 한 명씩 복사할 수 있습니다.</p>
    <div class="grid">${done}</div>
    ${skipped.length?`<p class="skipline">건너뜀: ${skipped.map(esc).join(", ")}</p>`:""}
    <div class="row"><button class="btn" id="copyall">전체 복사</button><button class="btn" id="back">돌아가서 수정</button></div>
    ${sample?"":`<p class="hint">자동 작성이 꺼져 있어 키워드만 정리했습니다. 이 내용을 대화창에 붙여 넣고 아이별 일지로 써 달라고 요청하세요.</p>`}</div>`;
}
async function copy(text,btn){
  try{await navigator.clipboard.writeText(text);btn.textContent="복사됨";if(btn.classList.contains("small"))setTimeout(()=>{btn.textContent="복사"},1500)}
  catch(e){btn.textContent="복사 실패"}
}
function allText(){
  return ROSTER.map((c,j)=>has(j)?`[${c.n}]\n${S.items[j].text||("키워드: "+S.items[j].kw.trim())}`:null).filter(Boolean).join("\n\n")
}
function bind(){
  const g=id=>document.getElementById(id);
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{if(!busy)go(+b.dataset.go)});
  if(g("kw"))g("kw").oninput=e=>{const it=S.items[S.i];it.kw=e.target.value;if(it.kw.trim())it.skipped=false;save();updateBtn()};
  if(g("next"))g("next").onclick=()=>{if(S.i<ROSTER.length-1)go(S.i+1);else{save();render()}};
  if(g("skip"))g("skip").onclick=()=>{const it=S.items[S.i];it.skipped=!it.skipped;save();if(it.skipped&&S.i<ROSTER.length-1)go(S.i+1);else render()};
  if(g("batchmake"))g("batchmake").onclick=batchMake;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{const j=+b.dataset.copy;copy(S.items[j].text||S.items[j].kw.trim(),b)});
  if(g("copyall"))g("copyall").onclick=e=>copy(allText(),e.target);
  if(g("back"))g("back").onclick=()=>{S.finished=false;save();render()};
}
function updateBtn(){
  const b=document.getElementById("batchmake");if(!b)return;
  const n=count();b.disabled=!n;b.textContent=sample?`${n}명 한 번에 작성`:`${n}명 정리하기`;
  const c=document.querySelector(`[data-go="${S.i}"]`),it=S.items[S.i];
  if(c){c.className="chip "+(it.skipped?"skipped":it.kw.trim()?"filled":"");c.innerHTML=esc(ROSTER[S.i].n)+(it.kw.trim()?"<small>입력됨</small>":"")}
}
async function batchMake(){
  const idx=ROSTER.map((c,j)=>j).filter(has);
  if(!idx.length)return;
  if(!sample){S.finished=true;save();render();return}
  // 키워드가 바뀐 아이만 다시 작성한다
  const todo=idx.filter(j=>!S.items[j].text||S.items[j].gen!==S.items[j].kw.trim());
  busy=true;err="";let done=0;progress=`작성 중 0/${todo.length}`;render();
  const failed=[],queue=todo.slice();
  async function worker(){
    while(queue.length){
      const j=queue.shift(),it=S.items[j];
      try{const r=await sample(prompt(ROSTER[j],it.kw.trim()),{cache:false});it.text=r.text.trim();it.gen=it.kw.trim()}
      catch(e){failed.push(ROSTER[j].n);it.text=""}
      done++;progress=`작성 중 ${done}/${todo.length}`;const b=document.getElementById("batchmake");if(b)b.textContent=progress;
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  busy=false;
  if(failed.length)err=`${failed.join(", ")}은(는) 작성에 실패했습니다. 버튼을 다시 눌러 주세요.`;
  else S.finished=true;
  save();render();
}
render();
(async()=>{try{const s=await window.claude?.use("sample");if(s){sample=s;if(!busy)render()}}catch(e){}})();
</script>
